<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style><![CDATA[
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: rgba(148, 163, 184, 0.07); stroke-width: 1; }
    
    /* Dynamic moving wave / background beams */
    @keyframes pulseBeam {
      0%, 100% { opacity: 0.15; transform: scaleY(1); }
      50% { opacity: 0.35; transform: scaleY(1.15); }
    }
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(40px, -25px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(-35px, 20px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes flowingLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.4; r: 3; }
      50% { opacity: 1; r: 5; }
    }

    .orb1 { animation: floatOrb1 10s ease-in-out infinite; }
    .orb2 { animation: floatOrb2 12s ease-in-out infinite; }
    .flow-path {
      stroke-dasharray: 20, 10;
      animation: flowingLine 25s linear infinite;
    }
    .node-pulse-1 { animation: nodeBlink 3s ease-in-out infinite; }
    .node-pulse-2 { animation: nodeBlink 4s ease-in-out infinite 1s; }
    .node-pulse-3 { animation: nodeBlink 3.5s ease-in-out infinite 2s; }

    /* Foreground Typography - Fixed & fully clear */
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
  ]]></style>

  <!-- Base Canvas -->
  <rect width="100%" height="100%" class="bg" rx="16" />

  <!-- Technical Background Grid -->
  <g>
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="360" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="360" class="grid-line" />
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
  </g>

  <!-- Ambient Glowing Dynamic Orbs (Behind content) -->
  <g opacity="0.35">
    <circle cx="220" cy="110" r="140" fill="#38bdf8" filter="url(#glow)" class="orb1" />
    <circle cx="980" cy="240" r="160" fill="#a855f7" filter="url(#glow)" class="orb2" />
    <circle cx="600" cy="50" r="100" fill="#6366f1" filter="url(#glow)" class="orb1" />
  </g>

  <!-- Dynamic Network Connection Hierarchy Lines (Kept to corners and background) -->
  <g opacity="0.45">
    <path d="M 50 300 Q 250 340 400 290 T 800 320 T 1150 280" fill="none" stroke="url(#primaryGrad)" stroke-width="2" class="flow-path" />
    <path d="M 100 60 Q 400 30 650 70 T 1100 40" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-path" opacity="0.6" />
    
    <!-- Background Organization Hierarchy Nodes -->
    <g transform="translate(920, 70)" opacity="0.5">
      <circle cx="60" cy="20" r="4" fill="#38bdf8" class="node-pulse-1" />
      <line x1="60" y1="20" x2="30" y2="60" stroke="#64748b" stroke-width="1.5" />
      <line x1="60" y1="20" x2="90" y2="60" stroke="#64748b" stroke-width="1.5" />
      <circle cx="30" cy="60" r="3.5" fill="#818cf8" class="node-pulse-2" />
      <circle cx="90" cy="60" r="3.5" fill="#c084fc" class="node-pulse-3" />
      <line x1="30" y1="60" x2="15" y2="95" stroke="#64748b" stroke-width="1" />
      <line x1="30" y1="60" x2="45" y2="95" stroke="#64748b" stroke-width="1" />
      <circle cx="15" cy="95" r="3" fill="#38bdf8" />
      <circle cx="45" cy="95" r="3" fill="#818cf8" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header Pill, Title, Subtitle, Badges (Crisp, High Contrast, Centered) -->
  <g transform="translate(100, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="260" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="18" cy="16" r="4.5" fill="#38bdf8" class="node-pulse-1" />
      <text x="32" y="21" class="badge-pill-text" fill="#38bdf8">Enterprise Architecture</text>
    </g>

    <!-- Title with Vibrant Gradient Accent -->
    <g transform="translate(0, 130)">
      <text x="0" y="0" class="title-text">
        Awesome <tspan fill="url(#primaryGrad)">Team Organization</tspan> &amp;
      </text>
      <text x="0" y="48" class="title-text">
        Seat Management
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 222)">
      <text x="0" y="0" class="subtitle-text">
        A curated index of IAM frameworks, SCIM 2.0 provisioning, team hierarchy models,
      </text>
      <text x="0" y="26" class="subtitle-text">
        and automated license quota allocation across SaaS &amp; Open-Source tools.
      </text>
    </g>

    <!-- Feature Capsule Pills in Foreground -->
    <g transform="translate(0, 280)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="168" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#38bdf8" />
        <text x="28" y="21" class="tag-text">SCIM 2.0 Provisioning</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="164" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#818cf8" />
        <text x="28" y="21" class="tag-text">Seat Quota Allocation</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(356, 0)">
        <rect width="164" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#c084fc" />
        <text x="28" y="21" class="tag-text">Hierarchical Groups</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(532, 0)">
        <rect width="186" height="32" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#34d399" />
        <text x="28" y="21" class="tag-text">Self-Hosted Open Source</text>
      </g>
    </g>
  </g>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
</svg>
