<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070a14"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseBeam{0%{opacity:.15;transform:scaleY(1)}50%{opacity:.35;transform:scaleY(1.15)}}@keyframes floatOrb1{0%{transform:translate(0,0)}50%{transform:translate(40px,-25px)}}@keyframes floatOrb2{0%{transform:translate(0,0)}50%{transform:translate(-35px,20px)}}@keyframes flowingLine{0%{stroke-dashoffset:600}}@keyframes nodeBlink{0%{opacity:.4;r:3}50%{opacity:1;r:5}}.bg{fill:url(#bgGrad)}.grid-line{stroke:rgba(148,163,184,.07);stroke-width:1}.orb1{animation:floatOrb1 10s ease-in-out infinite}.orb2{animation:floatOrb2 12s ease-in-out infinite}.flow-path{stroke-dasharray:20,10;animation:flowingLine 25s linear infinite}.node-pulse-1{animation:nodeBlink 3s ease-in-out infinite}.node-pulse-2{animation:nodeBlink 4s ease-in-out infinite 1s}.node-pulse-3{animation:nodeBlink 3.5s ease-in-out infinite 2s}.title-text{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.badge-pill-text,.subtitle-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.badge-pill-text{font-weight:700;font-size:13px;letter-spacing:1.2px;text-transform:uppercase}.subtitle-text{font-weight:400;font-size:18px;fill:#94a3b8}.tag-text{font-weight:600;font-size:13px;fill:#cbd5e1}</style><rect width="100%" height="100%" class="bg" rx="16"/><g><line x1="100" x2="100" y1="0" y2="360" class="grid-line"/><line x1="300" x2="300" y1="0" y2="360" class="grid-line"/><line x1="500" x2="500" y1="0" y2="360" class="grid-line"/><line x1="700" x2="700" y1="0" y2="360" class="grid-line"/><line x1="900" x2="900" y1="0" y2="360" class="grid-line"/><line x1="1100" x2="1100" y1="0" y2="360" class="grid-line"/><line x1="0" x2="1200" y1="80" y2="80" class="grid-line"/><line x1="0" x2="1200" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1200" y1="280" y2="280" class="grid-line"/></g><g opacity=".35"><circle cx="220" cy="110" r="140" fill="#38bdf8" class="orb1" filter="url(#glow)"/><circle cx="980" cy="240" r="160" fill="#a855f7" class="orb2" filter="url(#glow)"/><circle cx="600" cy="50" r="100" fill="#6366f1" class="orb1" filter="url(#glow)"/></g><g opacity=".45"><path fill="none" stroke="url(#primaryGrad)" stroke-width="2" d="M 50 300 Q 250 340 400 290 T 800 320 T 1150 280" class="flow-path"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 100 60 Q 400 30 650 70 T 1100 40" class="flow-path" opacity=".6"/><g opacity=".5" transform="translate(920, 70)"><circle cx="60" cy="20" r="4" fill="#38bdf8" class="node-pulse-1"/><line x1="60" x2="30" y1="20" y2="60" stroke="#64748b" stroke-width="1.5"/><line x1="60" x2="90" y1="20" y2="60" stroke="#64748b" stroke-width="1.5"/><circle cx="30" cy="60" r="3.5" fill="#818cf8" class="node-pulse-2"/><circle cx="90" cy="60" r="3.5" fill="#c084fc" class="node-pulse-3"/><line x1="30" x2="15" y1="60" y2="95" stroke="#64748b" stroke-width="1"/><line x1="30" x2="45" y1="60" y2="95" stroke="#64748b" stroke-width="1"/><circle cx="15" cy="95" r="3" fill="#38bdf8"/><circle cx="45" cy="95" r="3" fill="#818cf8"/></g></g><g><g transform="translate(100, 0) translate(0, 52)"><rect width="260" height="32" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="4.5" fill="#38bdf8" class="node-pulse-1"/><text x="32" y="21" fill="#38bdf8" class="badge-pill-text">Enterprise Architecture</text></g><g><text x="0" y="0" class="title-text" transform="translate(100, 0) translate(0, 130)">Awesome <tspan fill="url(#primaryGrad)">Team Organization</tspan> &amp;</text><text x="0" y="48" class="title-text" transform="translate(100, 0) translate(0, 130)">Seat Management</text></g><g><text x="0" y="0" class="subtitle-text" transform="translate(100, 0) translate(0, 222)">A curated index of IAM frameworks, SCIM 2.0 provisioning, team hierarchy models,</text><text x="0" y="26" class="subtitle-text" transform="translate(100, 0) translate(0, 222)">and automated license quota allocation across SaaS &amp; Open-Source tools.</text></g><g><g transform="translate(100, 0) translate(0, 280) translate(0, 0)"><rect width="168" height="32" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" rx="8"/><circle cx="16" cy="16" r="4" fill="#38bdf8"/><text x="28" y="21" class="tag-text">SCIM 2.0 Provisioning</text></g><g transform="translate(100, 0) translate(0, 280) translate(180, 0)"><rect width="164" height="32" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" rx="8"/><circle cx="16" cy="16" r="4" fill="#818cf8"/><text x="28" y="21" class="tag-text">Seat Quota Allocation</text></g><g transform="translate(100, 0) translate(0, 280) translate(356, 0)"><rect width="164" height="32" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" rx="8"/><circle cx="16" cy="16" r="4" fill="#c084fc"/><text x="28" y="21" class="tag-text">Hierarchical Groups</text></g><g transform="translate(100, 0) translate(0, 280) translate(532, 0)"><rect width="186" height="32" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" rx="8"/><circle cx="16" cy="16" r="4" fill="#34d399"/><text x="28" y="21" class="tag-text">Self-Hosted Open Source</text></g></g></g><rect width="1198" height="358" x="1" y="1" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="15"/></svg>